name: Werk release
on:
  pull_request:
    paths: ['/**']
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: werk-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
defaults:
  run:
    shell: bash
jobs:
  mutation:
    name: Mutation testing (advisory)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - id: source
        timeout-minutes: 2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: node
        timeout-minutes: 2
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.FORGE_PROJECT_PATH }}/package-lock.json
      - id: dependencies
        timeout-minutes: 3
        run: npm ci --ignore-scripts
      - id: mutation
        name: Measure the scoped mutation baseline without blocking publication
        run: npm run mutation:release
      - id: evidence
        timeout-minutes: 2
        name: Retain mutation reports even when the run is incomplete
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: werk-mutation-report
          path: ${{ env.FORGE_PROJECT_PATH }}/reports/mutation/
          if-no-files-found: warn
          retention-days: 30
      - name: Report advisory infrastructure failures
        if: always()
        working-directory: /
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          MUTATION_OUTCOME: ${{ steps.mutation.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          incomplete=false
          for outcome in "$SOURCE_OUTCOME" "$NODE_OUTCOME" "$DEPENDENCIES_OUTCOME" "$MUTATION_OUTCOME" "$EVIDENCE_OUTCOME"; do
            if [ "$outcome" != success ]; then incomplete=true; fi
          done
          if [ "$incomplete" = true ]; then
            echo "::warning title=Mutation testing incomplete::Advisory measurement or artifact retention did not complete. Inspect this job; publication remains independent."
          fi
          {
            echo "### Mutation job infrastructure"
            echo ""
            echo "Checkout: $SOURCE_OUTCOME; Node: $NODE_OUTCOME; dependencies: $DEPENDENCIES_OUTCOME; measurement: $MUTATION_OUTCOME; artifact: $EVIDENCE_OUTCOME."
            echo ""
            echo "This scoped measurement is advisory. See the mutation summary and werk-mutation-report artifact; it does not gate publication."
          } >> "$GITHUB_STEP_SUMMARY"
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.FORGE_PROJECT_PATH }}/package-lock.json
      - id: version
        name: Verify release version and tag ancestry
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF" = "refs/tags/v$VERSION"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate the versioned release changelog
        run: npm run changelog:check
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run audit:dependencies
      - run: npm run release:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: werk-release-candidate
          path: ${{ env.FORGE_PROJECT_PATH }}/release/*
          if-no-files-found: error
          retention-days: 7
  native:
    name: Native release (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: werk-release-candidate
          path: ${{ env.FORGE_PROJECT_PATH }}/release
      # Dependencies are used only by the source-side integrity/extraction harness.
      # The extracted application has no npm install step and cannot resolve them.
      - run: npm ci --ignore-scripts
      - name: Verify both archives and test the standalone download installer
        run: |
          node scripts/release/extract.mjs release "$RUNNER_TEMP/werk archive check"
          node scripts/release/install-smoke.mjs release "$RUNNER_TEMP/werk release"
      - name: Start, simulate a task, stop and restart the extracted native runtime
        run: node scripts/release/smoke.mjs --root "$RUNNER_TEMP/werk release/werk-${{ needs.build.outputs.version }}"
      - name: Verify installed project worker requests and run evidence
        if: runner.os != 'Windows'
        env:
          WERK_EXPECT_RUN_EVIDENCE: 1
          WERK_EXPECT_INTERACTIONS: 1
          WERK_PROJECT_WORKER_APP: ${{ runner.temp }}/werk release/werk-${{ needs.build.outputs.version }}/bin/apps/worker
        run: node scripts/release/project-worker-smoke.mjs --native
      - name: Verify YAML hierarchy, isolated lines and persistent workers
        run: node scripts/release/system-smoke.mjs --root "$RUNNER_TEMP/werk release/werk-${{ needs.build.outputs.version }}" --update-archives release
  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: werk-release-candidate
          path: ${{ env.FORGE_PROJECT_PATH }}/release
      - run: npm ci --ignore-scripts
      - run: node scripts/release/extract.mjs release "$RUNNER_TEMP/werk release"
      - name: Test the extracted Docker-only startup path
        env:
          WERK_DOCKER_RELEASE_ROOT: ${{ runner.temp }}/werk release/werk-${{ needs.build.outputs.version }}
        run: node scripts/release/docker-smoke.mjs
      - name: Test project worker setup, mounted Markdown intake and restart
        env:
          WERK_EXPECT_RUN_EVIDENCE: 1
          WERK_EXPECT_INTERACTIONS: 1
          WERK_PROJECT_WORKER_APP: ${{ runner.temp }}/werk release/werk-${{ needs.build.outputs.version }}/bin/apps/worker
        run: node scripts/release/project-worker-smoke.mjs
      - name: Test the extracted Docker Factory system definition
        env:
          WERK_DOCKER_RELEASE_ROOT: ${{ runner.temp }}/werk release/werk-${{ needs.build.outputs.version }}
        run: node scripts/release/docker-system-smoke.mjs
  cloud-init:
    name: Ubuntu 24.04 cloud-init VM
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: werk-release-candidate
          path: ${{ env.FORGE_PROJECT_PATH }}/release
      - run: npm ci --ignore-scripts
      - name: Install disposable VM qualification tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client openssl netcat-openbsd
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - run: node scripts/release/extract.mjs release "$RUNNER_TEMP/werk release"
      - name: Boot the exact candidate with generated cloud-init
        run: |
          set -o pipefail
          node scripts/release/cloud-init-smoke.mjs --root "$RUNNER_TEMP/werk release/werk-${{ needs.build.outputs.version }}" --archives release | tee "$RUNNER_TEMP/werk-vm-qualification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: werk-vm-qualification
          path: ${{ runner.temp }}/werk-vm-qualification.json
          if-no-files-found: warn
          retention-days: 7
  storybook:
    name: Storybook and screenshot qualification
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.FORGE_PROJECT_PATH }}/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install the locked browser version and system libraries
        run: npm exec -- playwright install --with-deps chromium
      - name: Build the code-derived stories and qualify every component screenshot
        run: npm run storybook:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: werk-storybook-release-evidence
          path: ${{ env.FORGE_PROJECT_PATH }}/storybook-static/storymap/
          if-no-files-found: warn
          retention-days: 7
      - name: Package only the qualified Storybook from this source revision
        run: npm run release:storybook
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: werk-storybook-candidate
          path: |
            ${{ env.FORGE_PROJECT_PATH }}/release/werk-storybook-*.zip
            ${{ env.FORGE_PROJECT_PATH }}/release/STORYBOOK-SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Upload the qualified site for GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: werk-storybook-pages
          path: ${{ env.FORGE_PROJECT_PATH }}/storybook-static
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, native, docker, cloud-init, storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: werk-release-candidate
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: werk-storybook-candidate
          path: release
      - name: Publish all verified assets before making the release visible
        working-directory: /
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd "$GITHUB_WORKSPACE"
          test -s release/RELEASE-NOTES.md
          cp release/RELEASE-NOTES.md release-notes.md
          cat >> release-notes.md <<EOF

          ## Installation

          Download a prebuilt archive below, extract it, and run \`node werk.mjs up\` with Node.js 24.
          Or download and start the latest stable release in Bash:

          \`curl -fsSL https://github.com/$GH_REPO/releases/latest/download/install.mjs -o werk-install.mjs && node werk-install.mjs\`

          PowerShell (Windows):

          \`curl.exe -fsSL https://github.com/$GH_REPO/releases/latest/download/install.mjs -o werk-install.mjs; if (\$LASTEXITCODE -eq 0) { node werk-install.mjs }\`

          The installer requires Node.js 24 and tar. It verifies its pinned archive checksum, preserves existing installations, and starts a local Factory with two simulated production lines. Ctrl+C stops the system. See the bundled README for credentials, Docker startup and operation.

          For this exact version, use the installer from /releases/download/v$RELEASE_VERSION/install.mjs instead of /releases/latest/download/install.mjs. Prereleases do not change latest.

          Download \`werk-storybook-$RELEASE_VERSION.zip\` and \`STORYBOOK-SHA256SUMS\` for the system handbook, component API, interactive examples and desktop/mobile screenshots from this exact source revision. After checksum verification and extraction, open \`handbook/index.html\` for workspace setup, team workflows and operation. Open \`storymap/index.html\` for the frontend component catalog and illustrated journeys. The interactive Storybook can be served from the extracted directory with a local static HTTP server. All examples use simulated fixtures; screenshots are not live-provider qualification.
          EOF
          # Failed uploads leave a draft; reruns may repair only that unpublished draft.
          if gh release view "v$RELEASE_VERSION" --json isDraft > existing-release.json 2>/dev/null; then
            jq -e '.isDraft == true' existing-release.json
          else
            gh release create "v$RELEASE_VERSION" --verify-tag --draft --title "Werk $RELEASE_VERSION" --notes-file release-notes.md
          fi
          gh release upload "v$RELEASE_VERSION" "release/werk-$RELEASE_VERSION.tar.gz" "release/werk-$RELEASE_VERSION.zip" release/install.mjs release/SHA256SUMS "release/werk-storybook-$RELEASE_VERSION.zip" release/STORYBOOK-SHA256SUMS --clobber
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            gh release edit "v$RELEASE_VERSION" --draft=false --prerelease --latest=false --notes-file release-notes.md
          else
            gh release edit "v$RELEASE_VERSION" --draft=false --prerelease=false --latest --notes-file release-notes.md
          fi
  pages:
    name: Publish released Storybook to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Keep deployment in this workflow: releases made by GITHUB_TOKEN do not
      # trigger a separate release-event workflow. Never rebuild after qualification.
      - name: Keep retries from replacing a newer published release
        id: freshness
        working-directory: /
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASES=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft == false)')
          CURRENT_TAG=$(jq -s -e -r --arg tag "$RELEASE_TAG" '
            if length > 0 and any(.tag_name == $tag)
            then max_by([.published_at, .id]).tag_name
            else error("Published release is missing from the repository response") end
          ' <<< "$RELEASES")
          if [[ "$CURRENT_TAG" == "$RELEASE_TAG" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Pages for $RELEASE_TAG because $CURRENT_TAG was published more recently."
          fi
      - name: Check GitHub Pages configuration
        if: steps.freshness.outputs.current == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the exact qualified release site
        if: steps.freshness.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: werk-storybook-pages

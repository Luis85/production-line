name: Werk release
on:
  pull_request:
    paths: ['/**']
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: werk-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.FORGE_PROJECT_PATH }}/package-lock.json
      - id: version
        name: Verify release version and tag ancestry
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF" = "refs/tags/v$VERSION"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run audit:dependencies
      - run: npm run release:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: werk-release-candidate
          path: ${{ env.FORGE_PROJECT_PATH }}/release/*
          if-no-files-found: error
          retention-days: 7
  native:
    name: Native release (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: werk-release-candidate
          path: ${{ env.FORGE_PROJECT_PATH }}/release
      # Dependencies are used only by the source-side integrity/extraction harness.
      # The extracted application has no npm install step and cannot resolve them.
      - run: npm ci --ignore-scripts
      - name: Verify both archives and test the standalone download installer
        run: |
          node scripts/release/extract.mjs release "$RUNNER_TEMP/werk archive check"
          node scripts/release/install-smoke.mjs release "$RUNNER_TEMP/werk release"
      - name: Start, simulate a task, stop and restart the extracted native runtime
        run: node scripts/release/smoke.mjs --root "$RUNNER_TEMP/werk release/werk-${{ needs.build.outputs.version }}"
      - name: Verify YAML hierarchy, isolated lines and persistent workers
        run: node scripts/release/system-smoke.mjs --root "$RUNNER_TEMP/werk release/werk-${{ needs.build.outputs.version }}" --update-archives release
  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: werk-release-candidate
          path: ${{ env.FORGE_PROJECT_PATH }}/release
      - run: npm ci --ignore-scripts
      - run: node scripts/release/extract.mjs release "$RUNNER_TEMP/werk release"
      - name: Test the extracted Docker-only startup path
        env:
          WERK_DOCKER_RELEASE_ROOT: ${{ runner.temp }}/werk release/werk-${{ needs.build.outputs.version }}
        run: node scripts/release/docker-smoke.mjs
      - name: Test project worker setup, mounted Markdown intake and restart
        env:
          WERK_PROJECT_WORKER_APP: ${{ runner.temp }}/werk release/werk-${{ needs.build.outputs.version }}/bin/apps/worker
        run: node scripts/release/project-worker-smoke.mjs
      - name: Test the extracted Docker Factory system definition
        env:
          WERK_DOCKER_RELEASE_ROOT: ${{ runner.temp }}/werk release/werk-${{ needs.build.outputs.version }}
        run: node scripts/release/docker-system-smoke.mjs
  cloud-init:
    name: Ubuntu 24.04 cloud-init VM
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: werk-release-candidate
          path: ${{ env.FORGE_PROJECT_PATH }}/release
      - run: npm ci --ignore-scripts
      - name: Install disposable VM qualification tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client openssl netcat-openbsd
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - run: node scripts/release/extract.mjs release "$RUNNER_TEMP/werk release"
      - name: Boot the exact candidate with generated cloud-init
        run: |
          set -o pipefail
          node scripts/release/cloud-init-smoke.mjs --root "$RUNNER_TEMP/werk release/werk-${{ needs.build.outputs.version }}" --archives release | tee "$RUNNER_TEMP/werk-vm-qualification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: werk-vm-qualification
          path: ${{ runner.temp }}/werk-vm-qualification.json
          if-no-files-found: warn
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, native, docker, cloud-init]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: werk-release-candidate
          path: release
      - name: Publish all verified assets before making the release visible
        working-directory: /
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd "$GITHUB_WORKSPACE"
          cat > release-notes.md <<EOF
          Download a prebuilt archive below, extract it, and run \`node werk.mjs up\` with Node.js 24.
          Or download and start the latest stable release in Bash:

          \`curl -fsSL https://github.com/$GH_REPO/releases/latest/download/install.mjs -o werk-install.mjs && node werk-install.mjs\`

          PowerShell (Windows):

          \`curl.exe -fsSL https://github.com/$GH_REPO/releases/latest/download/install.mjs -o werk-install.mjs; if (\$LASTEXITCODE -eq 0) { node werk-install.mjs }\`

          The installer requires Node.js 24 and tar. It verifies its pinned archive checksum, preserves existing installations, and starts a local Factory with two simulated production lines. Ctrl+C stops the system. See the bundled README for credentials, Docker startup and operation.

          For this exact version, use the installer from /releases/download/v$RELEASE_VERSION/install.mjs instead of /releases/latest/download/install.mjs. Prereleases do not change latest.
          EOF
          # Failed uploads leave a draft; reruns may repair only that unpublished draft.
          if gh release view "v$RELEASE_VERSION" --json isDraft > existing-release.json 2>/dev/null; then
            jq -e '.isDraft == true' existing-release.json
          else
            gh release create "v$RELEASE_VERSION" --verify-tag --draft --title "Werk $RELEASE_VERSION" --notes-file release-notes.md
          fi
          gh release upload "v$RELEASE_VERSION" "release/werk-$RELEASE_VERSION.tar.gz" "release/werk-$RELEASE_VERSION.zip" release/install.mjs release/SHA256SUMS --clobber
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            gh release edit "v$RELEASE_VERSION" --draft=false --prerelease --latest=false --notes-file release-notes.md
          else
            gh release edit "v$RELEASE_VERSION" --draft=false --prerelease=false --latest --notes-file release-notes.md
          fi

R gemerged</p>':''}</button>`).join('')||'<p class="empty">Keine passenden Features</p>'}</section>`}).join('')}</div><p class="notice">PR-Aktionen findest du in den Auftragsdetails. „Nächster Takt“ setzt aktive Arbeit fort und vergibt freie Slots. Reviews und Klärungsfälle warten auf dein Team.</p>`}
function deliveryDashboard(){const ts=taskList(),ws=workerList(),on=ws.filter(w=>w.online),used=ts.filter(active),needs=ts.filter(t=>['review','blocked'].includes(t.status)),events=data.events.filter(e=>(!currentLineId||e.lineId===currentLineId)&&(filter==='all'||e.project===filter));return `<div class="grid"><article class="panel"><h3>Umsetzungskapazität</h3><div class="metric">${used.length}<span class="muted metric-unit"> / ${ws.reduce((n,w)=>n+(w.maxParallel||1),0)} Slots belegt</span></div><p>${ws.filter(available).length} Maschinen mit freien Slots · ${ws.length-on.length} offline · ${ws.filter(w=>w.online&&(w.paused||w.quota)).length} eingeschränkt</p><div class="bar"><span style="width:${ws.length?used.length/Math.max(1,ws.reduce((n,w)=>n+(w.maxParallel||1),0))*100:0}%"></span></div></article><article class="panel"><h3>Entscheidungen des Teams</h3><div class="metric">${needs.length}<span class="muted metric-unit"> offene Übergaben</span></div><p>${ts.filter(t=>t.status==='review').length} PRs · ${ts.filter(t=>t.status==='blocked').length} Klärungsfälle</p></article><article class="panel"><h3>Abgeschlossene Features</h3><div class="metric">${ts.filter(t=>t.status==='done').length}<span class="muted metric-unit"> / ${ts.length}</span></div><p>${ts.filter(waiting).length} warten auf Umsetzungskapazität</p></article></div><section class="action-queue"><h2>Nächste Entscheidungen</h2>${needs.length?needs.map(t=>`<button data-task="${t.id}"><span class="pill">${t.pr?'PR #'+t.pr:'FT-'+t.id}</span><strong>${esc(t.title)}</strong><span class="muted">${t.approved?'Merge entscheiden':t.status==='blocked'?'Klärung öffnen':'Review öffnen'}</span></button>`).join(''):'<p class="muted">Aktuell keine offenen Review- oder Klärungsentscheidungen.</p>'}</section><div class="dashboard-grid"><section class="panel"><h2>Projektgebundene Maschinen</h2><div class="table-wrap"><table><thead><tr><th>Worker</th><th>Projekt</th><th>Status</th><th>Auftrag</th></tr></thead><tbody>${ws.map(w=>`<tr><td><button data-worker-detail="${w.id}">${w.id}</button></td><td>${project(w.project).name}</td><td class="${available(w)?'good':!w.online||w.quota?'warn':''}">${workerStatus(w)}</td><td>${workerTasks(w).map(t=>`<button class="text-button" data-task="${t.id}">FT-${t.id}</button>`).join(' ')||'—'}</td></tr>`).join('')}</tbody></table></div><button class="wide" id="register">Maschine registrieren</button></section><section class="panel"><h2>Ereignisprotokoll</h2><p>${filter==='all'?'Systemweit':project(filter).name} · Takte sind simulierte Schritte</p>${events.slice(0,8).map(e=>`<div class="event"><small>Takt ${e.tick??0} · ${esc(e.time||'Demo')}</small>${esc(e.text)}</div>`).join('')||'<p class="empty">Noch keine Ereignisse. Führe einen Takt aus.</p>'}</section></div>`}
function processView(){const ts=taskList();let t=ts.find(t=>t.id===processTaskId)||ts[0];if(t)processTaskId=t.id;const stepMap={queued:1,running:2,checks:2,review:4,changes:1,blocked:-1,done:5},current=t?stepMap[t.status]:-1;const steps=[['Iteration planen & importieren','Das Team pflegt Anforderungen, Designs, Spezifikationen und Tests in Obsidian. Ready-Features der Iteration werden idempotent importiert.','Iteration-Draft-PR → Intake API'],['Worker & Draft PR starten','Lease, Konfiguration und Iterations-Commit pinnen. Vorher-Snapshot committen; Feature-Draft-PR gegen den Iterationsbranch öffnen.','Scheduler → Worker → Draft PR'],['Implementieren und prüfen','Isolierter Feature-Worktree, vollständiger Vault-Kontext. Build und Tests liefern Nachweise. Drei fehlgeschlagene Prüfversuche erfordern eine Teamentscheidung.','Worker → Checks'],['Nachher-Snapshot & Review','Code und Snapshot-Paar landen im bestehenden PR. Checks am aktuellen Head müssen grün sein; Draft wird ready for review.','Worker → derselbe Feature-PR'],['Review nachhalten','Review-Feedback startet einen neuen Versuch mit neuen Snapshots am selben Branch und PR. Freigabe ermöglicht den Merge. Geschlossen ohne Merge führt zur Klärung.','Git-Ereignisse → Orchestrator'],['Merge bestätigen','Erst der Merge des Feature-PR in den Iterationsbranch schließt den Task ab. Der Iterations-PR bleibt separat. Es gibt keinen automatischen Merge in der Simulation.','Merge → abgeschlossen']];return `<div class="process-toolbar"><label for="processTask">Auftrag verfolgen</label><select id="processTask">${ts.map(x=>`<option value="${x.id}" ${x.id===t?.id?'selected':''}>FT-${x.id} · ${esc(x.title)}</option>`).join('')}</select>${t?`<span class="pill">${labels[t.status]}</span>`:''}</div><div class="process"><div class="steps">${steps.map(([a,b,c],i)=>`<article class="step ${i===current?'current':''} ${i<current?'complete':''}" data-n="${i+1}" ${i===current?'aria-current="step"':''}><h2>${a}</h2><p>${b}</p><span class="pill">${c}</span></article>`).join('')}</div><aside class="panel">${t?`<h2>FT-${t.id} im Fokus</h2><p>${esc(t.title)}</p><div class="kv"><span>Status</span><span>${labels[t.status]}</span></div><div class="kv"><span>Versuch</span><span>${t.attempt}</span></div><p class="${t.status==='blocked'?'warn':'muted'}">${esc(waitReason(t)|| (t.status==='done'?'Merge bestätigt. Der Auftrag ist abgeschlossen.':t.status==='checks'?'Build und Projekttests laufen.':'Die Maschine setzt die Akzeptanzkriterien um.'))}</p><button class="primary wide" data-task="${t.id}">Auftrag und PR öffnen</button><div class="section-label">Verlauf dieses Auftrags</div>${t.history.slice(-5).reverse().map(h=>`<div class="event"><small>Takt ${h.tick}</small>${esc(h.text)}</div>`).join('')}`:'<p>Für dieses Projekt gibt es noch keinen Auftrag.</p>'}<div class="flow-note">Der markierte Schritt folgt diesem Feature. Eine Nacharbeit springt zur Zuweisung zurück. „Klärung“ unterbricht den Ablauf bis zur Entscheidung.</div></aside></div>`}
function systemArchitectureView(){return `<div class="technical-intro"><h2>Factory → Produktionslinie → Orchestrator und Worker.</h2><p>Factories können weitere Factories enthalten. Jede Produktionslinie besitzt genau einen eigenen Orchestrator mit eigener Queue und eigenen Workern. src/factory verwaltet den Katalog; zwischen Linien werden keine Tasks automatisch verschoben. Die Browserdemo simuliert diese isolierten Linien in einem gemeinsamen lokalen Datenstand.</p><p>Der Orchestrator stellt diese Weboberfläche, den Intake und die Worker-API bereit. Node-Clients holen reservierte Aufträge, führen den Agenten lokal aus und liefern einen geprüften Änderungssatz. Die verbindliche Prozesssteuerung bleibt im Server und im Worker-Dienst.</p><span class="pill">Zielarchitektur · separater Entwicklungsstarter mit Mock-Ausführung</span></div><div class="dashboard-grid"><section class="panel"><h2>Server / Control Plane</h2><div class="table-wrap"><table><tr><th>Modul</th><th>Verantwortung</th></tr><tr><td>Web + Intake API</td><td>Projektteam-Anmeldung, Feature, Kriterien, Wikilinks, Kontextvorschau</td></tr><tr><td>Repo-Indexer</td><td>Read-only Git-Mirror; Vault-Pfade, Überschriften, Block-IDs und Aliase je Commit</td></tr><tr><td>Scheduler + Task Store</td><td>Projektbindung, Priorität, Slots; atomare Vergabe, Lease und Versuchszähler</td></tr><tr><td>Publication / Git Adapter</td><td>Geprüfte Änderung publizieren, PR erstellen oder aktualisieren, Review anfordern</td></tr><tr><td>PR Monitor</td><td>Signierte Webhooks deduplizieren, Git-Zustand regelmäßig abgleichen</td></tr><tr><td>Event API</td><td>SSE für Webview; geordnete Worker-Ereignisse mit Sequenznummer</td></tr></table></div><p><b>MVP-Vorschlag:</b> Node.js + TypeScript, SQLite im WAL-Modus und eine vom Server ausgelieferte Webview mit Intake als Startseite. Queue, Leases und Events liegen zunächst in derselben Datenbank. Ein Orchestrator-Prozess besitzt die Datei; Worker greifen ausschließlich über HTTP auf den Server zu. Redis ist zunächst nicht erforderlich.</p></section><section class="panel"><h2>Client / Worker-Dienst</h2><div class="table-wrap"><table><tr><th>Modul</th><th>Verantwortung</th></tr><tr><td>Poller + Heartbeat</td><td>Eigene Zuweisung abholen, Empfang bestätigen, Lease erneuern</td></tr><tr><td>Workspace Manager</td><td>Repo synchronisieren; Checkout und separaten Worktree am festgelegten Commit erzeugen</td></tr><tr><td>Context Resolver</td><td>Manifest verifizieren; referenzierte Passagen lesen, weitere Notizen gezielt erschließen</td></tr><tr><td>Agent Runner Adapter</td><td>Claude- oder Codex-CLI starten; JSONL normalisieren, Budget und Abbruch behandeln</td></tr><tr><td>Factory Tools</td><td>Schema-validierte lokale Tools für Lesen, Prüfungen, Diff und Rückfragen</td></tr><tr><td>Reporter + Journal</td><td>Nachweise, Anbieter-Session-ID, Ereignisse und Wiederanlaufzustand festhalten</td></tr></table></div><p>Der Client läuft als Dienst mit eigener Projektidentität und konfigurierbaren Maschinen- und Profil-Slots. Er öffnet ausgehende HTTPS-Verbindungen. Browser und Agent erhalten keine Worker-Identität.</p></section></div><section class="panel technical-section"><h2>Protokoll: gezielt pollen statt das ganze Board lesen</h2><p>Das Board ist eine Darstellung des Serverzustands. Der Worker verwendet eine schmale API; seine Projektbindung wird aus der authentifizierten Identität ermittelt.</p><div class="table-wrap"><table><thead><tr><th>Vorgeschlagener Endpunkt</th><th>Vertrag</th></tr></thead><tbody><tr><td><code>POST /v1/context/resolve</code></td><td>Projekt und Git-Commit prüfen; Wikilinks in eine versionierte Vorschau auflösen</td></tr><tr><td><code>POST /v1/tasks</code></td><td>Feature, Kriterien, Provider-Policy und Kontextmanifest erneut validieren; atomar einreihen</td></tr><tr><td><code>GET /v1/events</code></td><td>SSE für autorisierte Projekte; Fortsetzung ab letzter Event-ID</td></tr><tr><td><code>POST /v1/workers/register</code></td><td>Einmalige Registrierung mit serverseitig freigegebener Projektbindung und Fähigkeiten</td></tr><tr><td><code>POST /v1/worker/assignments/next</code></td><td>Atomar reservieren; Idempotency-Key; Long-Poll bis 25 s, sonst 204. Bei Retry dieselbe aktive Zuweisung liefern.</td></tr><tr><td><code>POST /v1/leases/:id/ack</code></td><td>Attempt und Fencing-Token prüfen; Startfrist bestätigen</td></tr><tr><td><code>POST /v1/leases/:id/heartbeat</code></td><td>Beispiel: alle 10 s, TTL 60 s. Serverzeit ist maßgeblich.</td></tr><tr><td><code>POST /v1/attempts/:id/events</code></td><td>Sequenznummer + Event-ID; deduplizieren, im Worker puffern und erneut zustellen</td></tr><tr><td><code>POST /v1/attempts/:id/publish</code></td><td>Aktive Lease, Manifest, getesteten Commit und Nachweise prüfen; Publikationsauftrag atomar speichern</td></tr><tr><td><code>POST /v1/git/webhooks</code></td><td>Review, CI und Merge verifizieren; Hintergrundabgleich gleicht fehlende Ereignisse aus</td></tr></tbody></table></div><div class="flow-note">Bei Netzverlust stoppt der Worker vor Ablauf seiner lokalen konservativen Lease-Frist; ohne bestätigte Lease wird nicht publiziert. Ein verspätetes Ergebnis wird mit 409 abgewiesen. Erneute Zustellung ist erlaubt, doppelte fachliche Wirkung wird über Idempotenz und Abgleich verhindert.</div></section><div class="dashboard-grid"><section class="panel"><h2>Kontext als versionierter Vertrag</h2><ol class="plain-steps"><li>Projektkonfiguration legt Repo, Zielbranch und Vault-Root fest.</li><li>Server löst Wikilinks am ausgewählten Git-Commit auf.</li><li>Fehlende oder mehrdeutige Pflichtreferenzen blockieren die Aufnahme.</li><li>Kontextmanifest fixiert Pfad, Selektor, Commit, Blob-ID bzw. SHA-256 und Resolver-Version.</li><li>Worker prüft denselben Stand vor Ausführung und protokolliert zusätzlich gelesene Quellen.</li></ol><p>Vollständiger Repo-Kontext ist lokal verfügbar. Der Startprompt enthält Auftrag, Manifest und ausgewählte Passagen. Weitere Referenzen werden gezielt nachgeladen, mit Mengenlimit und Zyklenerkennung.</p><p>Uncommitted Obsidian-Notizen werden nicht verteilt. Ein neuer Zielbranch-Stand oder neue fachliche Kriterien erzeugen eine explizite Revision; Kontext wird niemals still ausgetauscht.</p><div class="flow-note">MVP-Resolver: Markdown-Notiz, eindeutiger Kurzname/Alias, Überschrift und Block-ID. Vollständige Vault-Pfade lösen Mehrdeutigkeiten auf. Bei Vaults unterhalb des Repos ist der Vault-Root explizit konfiguriert. Symlinks und Pfade außerhalb erlaubter Wurzeln werden im realen Resolver abgewiesen.</div></section><section class="panel"><h2>Assignment-Schema (Vorschlag)</h2><pre class="code">interface Assignment {
  schemaVersion: 1;
  taskId: string;
  taskRevision: number;
  attemptId: string;
  workerId: string;
  projectId: string;
  lease: {
    id: string;
    fencingToken: number;
    expiresAt: string;
  };
  repository: string;
  baseCommit: string;
  targetBranch: string;
  branch: string;
  acceptanceCriteria: string[];
  contextManifestId: string;
  contextManifestSha256: string;
  stackProfileVersion: string;
  policyVersion: string;
  skillBundleVersion: string;
  provider: string; // registrierter Adapter
  profileId: string;
  adapterVersion: string;
  subscriptionRef: string; // keine Secrets
  timeoutSeconds: number;
  providerOptions: Record&lt;string, unknown&gt;;
}</pre><p>Revision beschreibt die fachliche Eingabe. Attempt beschreibt einen Ausführungsversuch. Ein neuer Versuch erhält eine neue Lease; eine Provider-Session ist weder Task noch Lease.</p></section></div><section class="panel technical-section"><h2>Deterministischer Rahmen, agentische Implementierung</h2><p>Der Node-Prozess führt die Zustandsmaschine aus: empfangen → bestätigen → Workspace vorbereiten → Kontext prüfen → Agent ausführen → unabhängige Checks → Publikation anfordern → Übergabe bestätigen. Das Agentenergebnis allein schließt keinen Auftrag ab.</p><div class="table-wrap"><table><tr><th>Schicht</th><th>Beispiele</th><th>Verbindlichkeit</th></tr><tr><td>Skills / Markdown</td><td>Feature implementieren, Projektkonventionen, Review-Änderungen bearbeiten</td><td>Arbeitsanweisungen; keine Garantie für Reihenfolge oder Ergebnis</td></tr><tr><td>Lokale Factory-Tools</td><td><code>context.read</code>, <code>context.resolve</code>, <code>checks.run</code>, <code>diff.inspect</code>, <code>question.raise</code></td><td>Eingabeschema, Pfadgrenzen, erlaubte Check-IDs, strukturierte Ergebnisse</td></tr><tr><td>Worker-Zustandsmaschine</td><td>Lease prüfen, Check-Exitcodes auswerten, Budget begrenzen, Testnachweis an Commit binden</td><td>Durch TypeScript-Code erzwungen</td></tr><tr><td>Server / Git Gates</td><td>Projektberechtigung, aktuelle Attempt-Version, CI-Status, Review, Branch-Schutz, Merge</td><td>Autoritative Freigabe; Agent kann keine Gates überspringen</td></tr></table></div><p>Jede Änderung nach einem Testlauf macht dessen Nachweis ungültig. Der Worker führt verpflichtende Checks selbst aus; ein Toolaufruf des Agenten ersetzt diese Freigabe nicht. Reproduzierbar sind Konfiguration, Eingaben und Gates; das erzeugte Modellresultat ist nicht deterministisch.</p></section><div class="dashboard-grid"><section class="panel"><h2>Provider-neutrale Runner-Adapter</h2><p>Start mit <b>Claude Code CLI</b> und <b>Codex CLI</b>, jeweils über die lokal eingerichtete Subscription-Anmeldung. Cursor ist eine spätere Erweiterung hinter demselben Vertrag. Ein Worker kann mehrere Profile desselben oder verschiedener Anbieter besitzen.</p><div class="table-wrap"><table><tr><th>Adapter</th><th>Programmatischer Einstieg</th></tr><tr><td>Claude</td><td><code>claude -p --output-format stream-json --verbose</code></td></tr><tr><td>Codex</td><td><code>codex exec --json --sandbox workspace-write -</code></td></tr><tr><td>Cursor</td><td>Vorgesehener Adapter; noch kein implementierter Vertrag</td></tr></table></div><p>Der Node-Dienst startet Kindprozesse mit Argumentarrays und <code>shell: false</code>, übergibt das Auftragspaket über stdin und normalisiert JSONL-Ereignisse. Exitcode, finales Ergebnis und vollständiges Stream-Ende werden gemeinsam geprüft. Fehlende Funktionen werden als nicht unterstützt gemeldet, nicht still ersetzt.</p><p>SDKs bleiben eine austauschbare Transportoption innerhalb des Adapters. Der gemeinsame Prozess kennt keine Claude-spezifischen Klassen, Session-IDs oder Settings.</p><pre class="code">interface AgentAdapter {
  probe(profile: Profile): Promise&lt;Health&gt;;
  capabilities(): Capabilities;
  run(input: RunInput,
      signal: AbortSignal): AsyncIterable&lt;AgentEvent&gt;;
}
// Gemeinsame Events:
// started, progress, toolCall, artifact,
// needsInput, usage, completed, failed
// Resume ist eine optionale Fähigkeit.</pre><div class="flow-note">Tool- und Skill-Bundles werden im Factory-Format versioniert und adapterspezifisch eingebunden. Gemeinsame Tools können über lokales MCP bereitstehen; lokale Factory-CLI-Befehle bieten eine testbare zweite Schnittstelle. Fähigkeiten und Aufrufdetails werden je unterstützter CLI-Version geprüft.</div></section>
<section class="panel"><h2>PR-Erstellung im Auftrag des Workers</h2><p>Der Worker initiiert die Publikation mit Änderungssatz, Testnachweisen und PR-Text. Der Server-Publisher besitzt die Git-Schreibrechte und erstellt oder aktualisiert den PR im Namen dieses Versuchs. Anschließend fordert er das Projektteam zum Review auf.</p><p>Diese Trennung macht das Fencing wirksam: Ein alter Worker kann nach Lease-Verlust nicht mit einem langlebigen Git-Token weiter publizieren. Direkte Git-Schreibrechte auf jedem Worker würden diese Garantie aufweichen.</p><p>Publikationsoperationen werden je Task-Revision serialisiert. Ein stabiler Branch und eine PR-Korrelations-ID ermöglichen Wiederaufnahme nach einem Absturz zwischen Push und PR-Erstellung; vor Wiederholung wird Git abgeglichen.</p><div class="flow-note">Transport: mindestens einmal. Fachliche Verarbeitung: idempotent. Kein behauptetes „Exactly once“ über Datenbank und externen Git-Provider.</div></section></div><section class="panel technical-section"><h2>Subscription-Profile und Kapazität</h2><p>Ein Profil verbindet Provider, lokale Authentifizierungsreferenz, unterstützte Modelle, Adapter-Version und Status. Secrets verbleiben auf der Maschine bzw. im Credential Store. Der Server erhält nur eine opake Profil-/Subscription-Referenz und die Verfügbarkeit.</p><p><b>Maschine ≠ Profil ≠ Kontingent:</b> Maschinen-Slots begrenzen CPU/RAM und Worktrees; Profil-Slots begrenzen parallele CLI-Sessions; eine Subscription kann ein gemeinsames Limit über mehrere Profile haben. Derselbe Account wird deshalb serverseitig einer gemeinsamen Quota-Gruppe zugeordnet, ohne Anmeldedaten zu kopieren.</p><p>Die lokale CLI-Anmeldung ist der Ausgangspunkt. Der Healthcheck prüft Login, Binärversion, Konfiguration und eine explizit ausgelöste Probe. Ein Login allein garantiert kein Restkontingent. Fehlende Limit-Telemetrie bleibt „unbekannt“. Unbeabsichtigte API-Key-Overrides werden erkannt; es gibt keinen stillen Wechsel von Subscription zu API-Abrechnung.</p><p>Claude-Subscription-Profil: kein <code>--bare</code>, da dieser Modus laut aktueller Dokumentation den Subscription-Login nicht verwendet. Stattdessen kontrollierte CLI-Konfiguration und geprüfte Projektinhalte. Codex verwendet für <code>exec</code> standardmäßig die gespeicherte CLI-Anmeldung.</p><p>Bei Loginverlust oder Limit pausiert das betroffene Profil. Ein aktiver Versuch wird angehalten. Neue Anbieterzuordnung erfolgt erst als neuer, protokollierter Versuch nach Freigabe; native Sessions werden nicht zwischen Anbietern übertragen.</p><p><b>Empfohlener erster Ausbauschritt:</b> ein Server, SQLite, ein Git-Provider, ein Worker je Projekt mit Claude- und Codex-Profilen und konfigurierbaren Slots. Heartbeat, Kontextmanifest, Agentlauf, Checknachweise und PR-Monitor bilden einen vertikalen Durchstich. Verteiltes Scheduling und zusätzliche Queue-Infrastruktur folgen erst bei Bedarf.</p><p><b>Dieser Prototyp:</b> Intake und Resolver laufen lokal mit Beispielnotizen. Dieses HTML bleibt eine lokale Konzeptsimulation. Der separate Entwicklungsstarter implementiert Server, SQLite, CLI-Intake, Lease-Polling und Worker-Status mit Mock-Ausführung. Reale Claude-/Codex-Läufe, Git-Kontextauflösung, Hashprüfung und PR-Publikation bleiben nächste Integrationsschritte.</p><details class="detail-disclosure"><summary>Offizielle Quellen · geprüft am 12.10.2026</summary><ul><li><a href="https://learn.chatgpt.com/docs/non-interactive-mode" target="_blank" rel="noopener noreferrer">Codex CLI: programmatischer Betrieb und Anmeldung</a></li><li><a href="https://learn.chatgpt.com/docs/auth" target="_blank" rel="noopener noreferrer">Codex: Authentifizierung</a></li><li><a href="https://code.claude.com/docs/en/headless" target="_blank" rel="noopener noreferrer">Claude Code CLI: programmatischer Betrieb</a></li><li><a href="https://code.claude.com/docs/en/authentication" target="_blank" rel="noopener noreferrer">Claude Code: lokale Anmeldungen</a></li><li><a href="https:/ function setProfileState(workerId,profileId,action){const w=data.workers.find(w=>w.id===workerId),p=w?.profiles.find(p=>p.id===profileId);if(!p)return false;const key={enable:'enabled',auth:'authenticated',limit:'limited'}[action];if(!key)return false;p[key]=!p[key];w.quota=false;for(const t of workerTasks(w))if(t.execution?.profileId===p.id&&(!p.enabled||!p.authenticated||p.limited)){release(t);t.status='blocked';t.check='pending';t.approved=false;t.blockReason=`Profil ${p.id}: ${profileState(p)}. Versuch gestoppt; erneute Freigabe erforderlich.`;record(`FT-${t.id}: ${t.blockReason}`,t)}record(`${w.id} / ${p.id}: ${profileState(p)}.`);return true}
function providersView(){return `<section class="technical-intro"><h2>Eine Maschine, mehrere lokale Provider-Profile</h2><p>Claude Code und Codex können auf demselben Worker über getrennte CLI-Anmeldungen arbeiten. Projektbindung und Maschinenkapazität bleiben davon unabhängig. Maschinen- und Profil-Slots sind konfigurierbar; jeder Versuch pinnt seine Konfigurationsversion.</p><span class="pill">CLI-Subscription-Profile · alle Anmeldungen und Limits simuliert</span></section><div class="provider-workers">${workerList().map(w=>`<section class="panel"><div class="provider-worker-heading"><div><h2>${w.id} · ${project(w.project).name}</h2><p>${workerStatus(w)} · ${workerTasks(w).length} / ${w.maxParallel||1} Maschinenslots belegt · ${w.profiles.length} Profile</p></div><button data-worker-detail="${w.id}">Maschine öffnen</button></div>${workerConfiguration(w)}<div class="profile-grid">${w.profiles.map(p=>`<article class="profile-row"><div><h3>${profileName(p.provider)}</h3><small>${esc(p.id)} · Subscription · ${p.maxParallel||1} Profil-Slot(s)</small></div><span class="${profileState(p)==='Bereit'?'good':'warn'}">${profileState(p)}<small class="profile-capacity">${workerTasks(w).filter(t=>t.execution?.profileId===p.id).length} / ${p.maxParallel||1} Sessions belegt</small></span><div class="profile-actions"><button data-profile-worker="${w.id}" data-profile="${p.id}" data-profile-action="enable">${p.enabled?'Deaktivieren':'Aktivieren'}</button><button data-profile-worker="${w.id}" data-profile="${p.id}" data-profile-action="limit">${p.limited?'Limit aufheben':'Limit simulieren'}</button><button data-profile-worker="${w.id}" data-profile="${p.id}" data-profile-action="auth">${p.authenticated?'Login-Verlust simulieren':'Anmeldung simulieren'}</button></div></article>`).join('')}</div><button class="wide" data-add-profile="${w.id}">Weiteres Subscription-Profil hinzufügen</button></section>`).join('')}</div><section class="panel technical-section"><h2>Cursor später ergänzen</h2><p>Cursor erhält einen eigenen Adapter hinter demselben Vertrag. Er ist hier noch nicht verfügbar und wird vom Scheduler nicht ausgewählt. Providerspezifische Sessions werden nicht zwischen Adaptern übertragen.</p><div class="flow-note">Zwei Profile bedeuten nicht automatisch zwei parallele Jobs. In der Zielarchitektur begrenzen Maschinen-Slots, Profil-Slots und gemeinsam genutzte Subscription-Limits die Vergabe unabhängig voneinander. Unbekannte Restkontingente werden als „unbekannt“ geführt, nicht als unbegrenzt.</div></section>`}
function bindProfiles(){ $$('[data-profile-action]').forEach(b=>b.onclick=()=>{setProfileState(b.dataset.profileWorker,b.dataset.profile,b.dataset.profileAction);persist();render()});$$('[data-add-profile]').forEach(b=>b.onclick=()=>{const w=data.workers.find(w=>w.id===b.dataset.addProfile);drawer(`<h2>Subscription-Profil für ${w.id}</h2><p class="muted">Lokaler Zugang mit eigenem CLI-Konfigurationsverzeichnis. Es werden keine echten Zugangsdaten erfasst.</p><form id="profileForm"><label for="profileProvider">Provider</label><select id="profileProvider"><option value="claude">Claude Code</option><option value="codex">Codex</option></select><button class="primary wide">Demo-Profil hinzufügen</button></form>`,'Provider-Profil hinzufügen');$('#profileForm').onsubmit=e=>{e.preventDefault();const provider=$('#profileProvider').value;let n=2;while(w.profiles.some(p=>p.id===w.id+'-'+provider+'-'+n))n++;w.profiles.push({id:w.id+'-'+provider+'-'+n,provider,label:profileName(provider)+' Subscription '+n,enabled:true,authenticated:true,limited:false,maxParallel:1,authMode:'subscription'});record(`${w.id}: Weiteres ${profileName(provider)}-Profil registriert.`);persist();close()}})}


function validateContext(c,p){if(c.schemaVersion!==1||c.projectId!==p||typeof c.baseCommit!=='string'||!/^[a-f0-9]{40}$/.test(c.baseCommit)||typeof c.vaultRoot!=='string'||typeof c.source!=='string'||!Array.isArray(c.references)||c.references.length>12)throw Error('Ungültiges Kontextmanifest');for(const r of c.references){if(!r||typeof r.raw!=='string'||typeof r.path!=='string'||!r.path.startsWith('docs/')||r.path.split('/').includes('..')||typeof r.excerpt!=='string'||(r.anchor!=null&&typeof r.anchor!=='string'))throw Error('Ungültige Kontextreferenz')}}

// Initialize every view before the single application render at the end.
let opsWorkers=3,opsMode='docker',statusWorkerId='W-01';
function operationsView(){const w=workerList().find(w=>w.id===statusWorkerId)||workerList()[0];const commands=opsMode==='docker'?`node scripts/init-env.mjs\ndocker compose up --build -d --scale worker=${opsWorkers}\ndocker compose ps\ndocker compose port --index 1 worker 4100\ndocker compose logs -f orchestrator worker\ndocker compose stop`:`npm run build\nnpm run dev:fleet -- --workers ${opsWorkers}\n# Zweites Terminal: CLI-Zugriff\nsource .state/fleet/env.sh\nnode src/orchestrator/dist/orchestrator/cli.js task create \\\n  --file examples/task.json --key order-export-001`;
return `<section class="technical-intro"><h2>Ein Orchestrator, ${opsWorkers} Worker, kein Datenbankserver.</h2><p>Intake ist die Startseite der Webview. Der Server bietet dieselben Anwendungsfälle über HTTP und seine CLI an. Worker laufen unabhängig, teilen keine Datenbankdatei und stellen ihren eigenen lesenden HTML-Status bereit.</p><span class="pill">Entwicklungsstarter · echte API, simulierte Umsetzung</span></section><div class="dashboard-grid"><section class="panel"><h2>Entwicklungsprojekte</h2><div class="table-wrap"><table><tr><th>Quellpfad</th><th>Eigenständige Verantwortung</th></tr><tr><td><code>src/factory</code></td><td>Factory-Hierarchie, Linienkatalog und registrierte Orchestrator-Endpunkte; keine gemeinsame Taskqueue</td></tr><tr><td><code>src/orchestrator</code></td><td>CLI, HTTP-API, Intake/Webview, SQLite, Scheduler, Git-Publisher als spätere Erweiterung</td></tr><tr><td><code>src/worker</code></td><td>CLI, Poller, Provider-Adapter, lokale Status-Webview, Ausführungszustand</td></tr><tr><td><code>src/shared</code></td><td>Typisierte Verträge, Laufzeitvalidierung, API-/CLI-Helfer; keine Abhängigkeit auf Server oder Worker</td></tr></table></div><p>Alle drei Apps besitzen ein eigenes package.json und Dockerfile. Der Build kopiert benötigte Shared-Module in das jeweilige dist-Verzeichnis. Jede App lässt sich mit Node 24 unabhängig von den anderen Projekten starten.</p><pre class="code">npm run build --workspace @werk/factory
npm run build --workspace @werk/orchestrator
npm run build --workspace @werk/worker
# Je App eigenständig auslieferbar:
src/factory/dist/factory/cli.js
src/orchestrator/dist/orchestrator/cli.js
src/worker/dist/worker/cli.js</pre></section><section class="panel"><h2>Testflotte starten</h2><div class="board-toolbar"><label for="opsMode">Umgebung</label><select id="opsMode"><option value="docker" ${opsMode==='docker'?'selected':''}>Docker Compose</option><option value="local" ${opsMode==='local'?'selected':''}>Lokale Node-Prozesse</option></select><label for="opsWorkers">Worker</label><select id="opsWorkers">${[1,3,5,10].map(n=>`<option value="${n}" ${n===opsWorkers?'selected':''}>${n}</option>`).join('')}</select></div><pre class="code">${esc(commands)}</pre><p>Der lokale Flottenstarter vergibt getrennte Zustandsverzeichnisse und Ports ab 4101. Docker skaliert Worker mit eigenen anonymen Volumes und dynamischen, an 127.0.0.1 gebundenen Host-Ports. Keine festen Container-Namen.</p><small>Die Befehle gehören zum beiliegenden Starter. Dieses HTML startet keine Prozesse.</small></section></div><section class="panel technical-section"><h2>Headless Intake: CLI und HTTP führen zum selben Service</h2><div class="table-wrap"><table><tr><th>CLI</th><th>Schnittstelle</th></tr><tr><td><code>werk-orchestrator serve</code></td><td>Startet API + Webview + SQLite; Standardroute / ist Intake</td></tr><tr><td><code>werk-orchestrator task create --file - --key feature-123</code></td><td>Liest genau ein JSON-Objekt von stdin; POST /v1/tasks mit Idempotency-Key</td></tr><tr><td><code>werk-orchestrator task list</code></td><td>GET /v1/tasks; maschinenlesbares JSON auf stdout</td></tr><tr><td><code>werk-orchestrator task get --id ID</code></td><td>Ein Auftrag inklusive aktuellem Status und Versuch</td></tr><tr><td><code>werk-orchestrator task events --id ID</code></td><td>Geordnete Ereignisse zu einem Auftrag</td></tr><tr><td><code>werk-orchestrator workers list</code></td><td>Worker, Projekt, Profile und letzter Kontakt</td></tr><tr><td><code>werk-worker run</code></td><td>Registrierung, Polling, Heartbeats und lokale Status-Webview</td></tr><tr><td><code>werk-worker status --format html</code></td><td>Exportiert einen lesbaren Status-Snapshot; JSON ist Standard</td></tr></table></div><p>Credentials kommen aus der Umgebung oder der lokalen Worker-Identität. JSON-Ergebnisse gehen auf stdout, Fehler und Logs auf stderr. Exitcodes: 0 Erfolg, 2 Eingabe-/API-Fehler, 1 Laufzeitfehler. <code>--help</code> dokumentiert die verfügbaren Optionen.</p></section><div class="dashboard-grid"><section class="panel"><h2>SQLite: bewusst ein Serverprozess</h2><ul class="plain-steps"><li>WAL, Foreign Keys, Busy-Timeout und kurze Transaktionen.</li><li>Atomare Reservierung mit BEGIN IMMEDIATE; konfigurierbare Slots pro Worker; eine Lease pro Task.</li><li>Task und Ereignis werden in derselben Transaktion gespeichert.</li><li>Schema-Version per Migration; Persistenz im Server-Volume /data.</li><li>Keine Datenbank auf NFS und kein gemeinsames DB-Volume für Worker.</li><li>Backup im Starter bei gestopptem Server; Restore mit derselben Schema-Version.</li></ul><p>Mehrere Worker sind vorgesehen; mehrere aktive Orchestrator-Replikate sind für Iteration 1 ausgeschlossen. Ein späterer Datenbankwechsel bleibt hinter dem Store-Interface.</p><a href="https://www.sqlite.org/wal.html" target="_blank" rel="noopener noreferrer">SQLite: WAL und Nebenläufigkeit</a></section><section class="panel"><h2>Worker-Status als HTML</h2><label for="statusWorker">Maschine in der Konzeptsimulation</label><select id="statusWorker">${workerList().map(x=>`<option value="${esc(x.id)}" ${x.id===w?.id?'selected':''}>${esc(x.id)} · ${project(x.project).name}</option>`).join('')}</select>${w?`<div class="kv"><span>Projekt</span><span>${project(w.project).name}</span></div><div class="kv"><span>Maschine</span><span>${workerStatus(w)}</span></div><div class="kv"><span>Aktive Aufträge</span><span>${workerTasks(w).length?workerTasks(w).map(x=>'FT-'+x.id+' / Versuch '+x.attempt).join(', '):'Kein aktiver Auftrag'}</span></div><div class="kv"><span>Ausführungsprofil</span><span>${esc(workerTasks(w).map(t=>t.execution?.profileId).filter(Boolean).join(', ')||'Nicht belegt')}</span></div><div class="kv"><span>Profile</span><span>${w.profiles.map(p=>`${profileName(p.provider)}: ${profileState(p)}`).join('<br>')}</span></div>`:'<p>Keine Worker registriert.</p>'}<p>Der echte Starter stellt auf jedem Worker <code>/</code> als HTML, <code>/status</code> als JSON und <code>/healthz</code> bereit. Kontaktzeit und Fehler zeigen auch einen unterbrochenen Serverkontakt an. Die Statusseite zeigt keine Credentials oder Repo-Inhalte.</p><small>Obige Werte stammen aus der Browserdemo, nicht aus laufenden Prozessen.</small></section></div><section class="panel technical-section"><h2>Was jetzt läuft — und was folgt</h2><p><b>Starter:</b> drei CLI-Builds, HTTP-Intake mit Wikilinks, SQLite-Persistenz, Token-Zugriff, projektgebundene Mock-Profile, atomare Zuweisung, Lease-Verlängerung, verspätete Ergebnisse abweisen, HTML-/JSON-Status und Flottenstart. Mock-Ergebnisse heißen „simulated“ und erzeugen keine PRs.</p><p><b>Nächster Durchstich:</b> echte CLI-Adapter für Claude und Codex, Git-Checkout + Obsidian-Resolver, versionierte Skills und Tools, Check-Gates, idempotente PR-Publikation und PR-Monitor. Subscriptions bleiben lokale Profile; keine Credentials im Image. Cursor folgt als weiterer Adapter.</p><p><b>Betrieb:</b> je ein Dockerfile, Compose mit Healthchecks, Non-Root-Benutzer, Shutdown und persistentem SQLite-Volume. Worker-Volumen enthalten Identität und Zustand. Für dauerhaft benannte Worker werden explizite Dienste mit eigenen benannten Volumes eingerichtet; Test-Replikate sind austauschbar.</p></section>`}

function workerConfiguration(w){return `<details class="detail-disclosure"><summary>Worker konfigurieren · Version ${w.configVersion||1}</summary><form data-worker-config="${w.id}"><div class="intake-row"><div><label for="parallel-${w.id}">Parallele Tasks</label><input id="parallel-${w.id}" name="parallel" type="number" min="1" max="8" value="${w.maxParallel||1}" required></div><div><label for="timeout-${w.id}">Timeout pro Versuch (Sekunden)</label><input id="timeout-${w.id}" name="timeout" type="number" min="60" max="3600" value="${w.timeoutSeconds||900}" required></div></div><label for="prompt-${w.id}">Systemprompt</label><textarea id="prompt-${w.id}" name="prompt" maxlength="20000" required>${esc(w.systemPrompt||'Implementiere das Feature anhand des versionierten Projektkontexts. Befolge die Factory-Policy und liefere prüfbare Nachweise.')}</textarea>${w.profiles.map(p=>`<label for="limit-${p.id}">${profileName(p.provider)} · parallele Sessions</label><input id="limit-${p.id}" data-config-profile="${p.id}" type="number" min="1" max="8" value="${p.maxParallel||1}" required>`).join('')}<p class="notice">Konfiguration wird bei freiem Worker übernommen. Laufende Versuche behalten ihre Version. Systemprompt und Timeout werden hier gespeichert; echte CLI-Ausführung folgt im Adapter. Factory-Gates können durch den Prompt nicht abgeschaltet werden.</p><button type="submit" ${workerTasks(w).length?'disabled':''}>${workerTasks(w).length?'Zuerst aktive Tasks abschließen':'Konfiguration übernehmen'}</button></form></details>`}
function iterationIntake(){const selectedProject=project(intakeDraft.project),imported=data.tasks.filter(t=>t.lineId===lineForProject(selectedProject.id).id&&t.project===selectedProject.id&&t.sourceFeatureId).length;return `<section class="panel iteration-intake"><h2>Ready-Features aus der Wochenplanung</h2><div class="board-toolbar"><label for="iterationProject">Projekt für den Intake</label><select id="iterationProject">${projects.map(p=>`<option value="${p.id}" ${p.id===selectedProject.id?'selected':''}>${p.name}</option>`).join('')}</select><span class="muted">${selectedProject.repo}</span></div><p>Die Wochenplanung liegt als <b>Iterationsbranch mit Draft PR</b> im Projekt-Repo. Übernimm die als bereit markierten Features. Dein Team kann während der Umsetzung die nächste Iteration in Obsidian vorbereiten.</p><div class="table-wrap"><table><tr><th>Iterationsbranch</th><th>Iterations-PR</th><th>Feature-Status</th></tr><tr><td>iteration/2026-W42</td><td>Draft · Ziel main</td><td>2 bereit · 1 in Ausarbeitung · Demo</td></tr></table></div><div class="inline"><button class="${imported?'':'primary'}" id="importIterationDemo">${imported?'Import erneut prüfen':'2 Ready-Features importieren'}</button><span class="muted">${imported} importierte Demo-Features · wiederholbar ohne Duplikate</span></div>${imported?`<div class="import-receipt" role="status"><p><strong>Import übernommen.</strong> Öffne das Taskboard und starte die Umsetzung mit „Nächster Takt“.</p><button class="primary" data-project-board="${selectedProject.id}">Zum Taskboard</button></div>`:''}<p class="notice">Die Auswahl gilt für den gesamten Intake. Diese Demo importiert ausschließlich Beispielnotizen; der reale Importbefehl gehört zum Starter.</p><details class="detail-disclosure"><summary>Importvertrag und Beispielnotiz</summary><p class="notice">Nur <code>factory_status: ready_for_implementation</code> wird übernommen. Projekt + Iteration + Feature-ID verhindern Duplikate. Eine geänderte Spezifikation braucht eine ausdrückliche Revision.</p><pre class="code">---
factory_id: REQ-241
factory_iteration: 2026-W42
factory_status: ready_for_implementation
title: ${esc(repoNotes(selectedProject.id)[0].path.split('/').at(-1).replace('.md',''))} umsetzen
factory_acceptance:
  - Die referenzierten Regeln sind durch Tests belegt
factory_context:
  - "[[${esc(repoNotes(selectedProject.id)[0].path.replace(/\.md$/,''))}#Regeln]]"
factory_provider: auto
---</pre></details></section>`}
let vaultDraftRef='';
function vaultIntake(){return `<section class="panel vault-intake"><h2>Requirement aus dem Vault einreichen</h2><p>Ein Wikilink genügt. Projekt und Produktionslinie sind oben ausgewählt; die verlinkte Notiz bleibt die fachliche Quelle.</p><form id="vaultIntakeForm"><label for="requirementRef">Pfad im Projekt-Vault</label><div class="vault-intake-controls"><input id="requirementRef" required maxlength="1000" value="${esc(vaultDraftRef)}" placeholder="[[Features/Customer portal]]"><button class="primary" type="submit">Requirement übernehmen</button></div><p class="notice">Titel wird nur für die Anzeige aus dem Link abgeleitet. Akzeptanzkriterien werden nicht erfunden. Bekannte Demo-Notizen können aufgelöst werden; unbekannte Referenzen werden zur Klärung gespeichert.</p><button type="button" id="vaultExample" class="text-button">Beispiel aus dem Demo-Vault einsetzen</button><p id="vaultIntakeError" class="form-error hidden" role="alert"></p></form></section>`}
function reviseTaskRequirement(id,requirementRef){
 const t=data.tasks.find(t=>t.id===id);
 if(!t||t.status!=='blocked'||t.requirementResolution!=='unresolved'||t.attempt!==0)throw Error('Nur noch nicht gestartete Requirements in Klärung können korrigiert werden.');
 const parsed=parseWiki(requirementRef);if(parsed.error)throw Error(parsed.error);
 const resolution=resolveWiki(parsed.raw,t.project);
 t.requirementRef=parsed.raw;t.title=parsed.path.split('/').at(-1).replace(/\.md$/,'');t.intakeRevision=(t.intakeRevision||1)+1;
 if(resolution.error){t.blockReason='Requirement-Auflösung erforderlich: '+resolution.error+' Kein echter Vault verbunden.';record('FT-'+t.id+': Requirement-Referenz korrigiert; Klärung bleibt offen.',t)}
 else {t.context=contextManifest({project:t.project,links:parsed.raw});t.requirementResolution='demo_resolved';t.status='queued';t.blockReason='';record('FT-'+t.id+': Korrigiertes Requirement im Demo-Index aufgelöst und eingereiht.',t)}
 return t;
}
function requirementRepair(t){
 if(t.requirementResolution!=='unresolved'||t.status!=='blocked'||t.attempt!==0)return '';
 return `<form id="requirementRepair" class="requirement-repair"><label for="repairRequirementRef">Requirement-Pfad korrigieren</label><input id="repairRequirementRef" required maxlength="1000" value="${esc(t.requirementRef)}"><p class="notice">Der Task und seine Linie bleiben erhalten. Zum Ausprobieren: ${esc('[['+repoNotes(t.project)[0].path.replace(/\.md$/,'')+'#Regeln]]')}</p><button type="submit">Referenz prüfen und aktualisieren</button><p id="requirementRepairError" class="form-error hidden" role="alert"></p></form>`;
}
function addVaultTask(projectId,requirementRef,lineId=null){
 const parsed=parseWiki(requirementRef);if(parsed.error)throw Error(parsed.error);
 const resolution=resolveWiki(parsed.raw,projectId),t=addTask({project:projectId,lineId,requirementRef:parsed.raw,title:parsed.path.split('/').at(-1).replace(/\.md$/,''),criteria:'',provider:'auto',priority:1});
 t.requirementRef=parsed.raw;t.requirementResolution=resolution.error?'unresolved':'demo_resolved';
 if(resolution.error){t.status='blocked';t.blockReason='Requirement-Auflösung erforderlich: '+resolution.error+' Kein echter Vault verbunden.';record('FT-'+t.id+': Referenz gespeichert; Umsetzung wartet auf eindeutig aufgelösten Projektkontext.',t)}
 else {t.context=contextManifest({project:projectId,links:parsed.raw});record('FT-'+t.id+': Requirement im Demo-Index aufgelöst; Inhalt bleibt im Kontextmanifest.',t)}
 return t;
}

 $$('[data-worker-config]').forEach(form=>form.onsubmit=e=>{e.preventDefault();try{const w=data.workers.find(w=>w.id===form.dataset.workerConfig);applyWorkerConfiguration(w,{maxParallel:Number(form.elements.parallel.value),timeoutSeconds:Number(form.elements.timeout.value),systemPrompt:form.elements.prompt.value,profiles:Array.from(form.querySelectorAll('[data-config-profile]')).map(el=>({id:el.dataset.configProfile,maxParallel:Number(el.value)}))});persist();render();toast('Worker-Konfiguration gespeichert.');}catch(error){toast(error.message)}});
 if($('#snapshotMetric'))$('#snapshotMetric').onchange=e=>{snapshotMetric=e.target.value;render()};
 $$('[data-snapshot-task]').forEach(b=>b.onclick=()=>openTask(Number(b.dataset.snapshotTask)));

function applyWorkerConfiguration(w,config){
 if(!w)throw Error('Worker fehlt.');if(workerTasks(w).length)throw Error('Aktive Versuche zuerst abschließen.');
 const maxParallel=boundedInteger(config.maxParallel,1,1,8),timeoutSeconds=boundedInteger(config.timeoutSeconds,900,60,3600);
 if(typeof config.systemPrompt!=='string'||!config.systemPrompt.trim()||config.systemPrompt.length>20000)throw Error('Systemprompt muss 1 bis 20.000 Zeichen enthalten.');
 const limits=w.profiles.map(p=>({id:p.id,maxParallel:boundedInteger(config.profiles.find(x=>x.id===p.id)?.maxParallel,p.maxParallel||1,1,8)}));
 Object.assign(w,{maxParallel,timeoutSeconds,systemPrompt:config.systemPrompt,configVersion:(w.configVersion||1)+1});
 for(const limit of limits)w.profiles.find(p=>p.id===limit.id).maxParallel=limit.maxParallel;
 record(`${w.id}: Konfiguration v${w.configVersion}, ${w.maxParallel} parallele Tasks.`);
}
function importIterationFeatures(projectId,lineId=null){
 if(!project(projectId))throw Error('Projekt fehlt.');
 const targetLine=lineForProject(projectId,lineId);const note=repoNotes(projectId)[0],featureNames={atlas:['Bestellfreigabe','Audit-Protokoll für Freigaben'],portal:['Rechnungsdownload','Zugriffsprüfung für Rechnungen'],field:['Einsatzplanung','Qualifikationen in der Einsatzplanung']};let count=0;
 for(const [index,title]of featureNames[projectId].entries()){
  const id='REQ-'+(241+index);if(data.tasks.some(t=>t.lineId===targetLine.id&&t.project===projectId&&t.sourceFeatureId===id&&t.iterationBranch==='iteration/2026-W42'))continue;
  const t=addTask({project:projectId,lineId:targetLine.id,title:title+' aus der Iterationsplanung',criteria:'Die verlinkten Regeln sind umgesetzt; Erfolgsfall, Grenzfälle und fehlende Berechtigung sind durch Tests belegt.',provider:'auto',priority:1});
  t.sourceFeatureId=id;t.sourceCommit=demoCommits[projectId];t.intakeRevision=1;t.context=contextManifest({project:projectId,links:'[['+note.path.replace(/\.md$/,'')+'#Regeln]]\n[[DoD#Checks]]'});count++;
 }return count;
}
function demoSnapshot(t,phase,outcome='simulated'){
 t.snapshots=t.snapshots||[];
 if(t.snapshots.some(s=>s.attempt===t.attempt&&s.phase===phase))return;
 const w=data.workers.find(w=>w.id===t.worker),before=t.snapshots.find(s=>s.attempt===t.attempt&&s.phase==='before');
 t.snapshots.push({schemaVersion:2,id:`FT-${t.id}-a${t.attempt}-${phase}`,phase,attempt:t.attempt,taskId:t.id,workerId:t.worker,project:t.project,lineId:t.lineId,profileId:t.execution?.profileId||null,configurationVersion:t.configVersion||w?.configVersion||1,capturedAt:new Date().toISOString(),tick:data.tick,source:'browser_simulation',leaseId:t.lease,repository:{name:project(t.project).repo,targetBranch:t.iterationBranch,baseCommit:t.sourceCommit||t.context?.baseCommit||null,pullRequest:t.pr},execution:{outcome:phase==='before'?'pending':outcome,durationMs:null,elapsedTicks:phase==='after'&&before?Math.max(0,data.tick-before.tick):null,reason:'Takte sind Simulationsschritte, keine gemessene Laufzeit'},resources:{scope:'worker_process',rssBytes:null,cpuTimeMs:null,reason:'Kein Zugriff auf einen Worker-Prozess'},usage:{inputTokens:null,outputTokens:null,providerReportedCostUsd:null,subscriptionAllocation:null,reason:'Keine Anbieter-Telemetrie'},quality:{state:phase==='before'?'pending':outcome==='checks_failed'?'simulated_failed':outcome==='simulated'?'simulated_passed':'not_evaluated',coveragePercent:null},artifactPath:`.factory/runs/FT-${t.id}/attempt-${t.attempt}/lease-${t.attempt}/${phase}.json`});
}
function snapshotDetails(t){const snapshots=t.snapshots||[];return `<details class="detail-disclosure"><summary>Iteration, Draft PR & Worker-Snapshots</summary><div class="kv"><span>Feature-Branch</span><span>factory/FT-${t.id}</span></div><div class="kv"><span>PR-Ziel</span><span>${esc(t.iterationBranch||'iteration/2026-W42')}</span></div><div class="kv"><span>Iterations-PR</span><span>Draft → main · getrennt vom Feature-PR</span></div><p>Der Feature-Draft-PR entsteht beim Arbeitsstart. Jede Nacharbeit behält PR und Branch und erhält ein neues Snapshot-Paar. Der Merge in den Iterationsbranch schließt den Task.</p>${snapshots.length?snapshots.map(s=>`<details><summary>${s.phase==='before'?'Vorher':'Nachher'} · Versuch ${s.attempt} · ${esc(s.workerId||'Worker')} · Konfiguration v${s.configurationVersion}</summary><pre class="code">${esc(JSON.stringify(s,null,2))}</pre></details>`).join(''):'<p>Dieser Demo-Ausgangszustand enthält noch keine Snapshots. Neue Versuche erfassen sie ab dem nächsten Takt.</p>'}<p class="notice">Snapshot-Dateien gehören zum Feature-PR. Tatsächliche PR-ID, Head-Commit, CI- und Review-Ereignisse werden zusätzlich im Orchestrator zugeordnet, ohne archivierte Snapshots umzuschreiben.</p></details>`}
let snapshotMetric='duration';
function dashboard(){return deliveryDashboard()+snapshotDashboard()}
function snapshotSeries(){
 return taskList().flatMap(t=>(t.snapshots||[]).filter(s=>s.phase==='after').map(after=>({task:t,after,before:(t.snapshots||[]).find(s=>s.attempt===after.attempt&&s.phase==='before')}))).sort((a,b)=>a.after.tick-b.after.tick||a.task.id-b.task.id);
}
function snapshotDashboard(){
 const ts=taskList(),snapshots=ts.flatMap(t=>t.snapshots||[]),rows=snapshotSeries(),complete=rows.filter(r=>r.before).length;
 const attempts=new Map();for(const t of ts)for(const s of t.snapshots||[]){const key=t.id+':'+s.attempt;if(!attempts.has(key))attempts.set(key,{task:t,attempt:s.attempt,phases:new Set()});attempts.get(key).phases.add(s.phase)}
 const pending=[...attempts.values()].filter(x=>x.phases.size===1&&x.phases.has('before')&&active(x.task)&&x.attempt===x.task.attempt).length,incomplete=attempts.size-complete-pending;
 const samples=rows.map(r=>({...r,value:snapshotMetric==='rss'?(r.after.source!=='worker_process'||r.after.resources?.rssBytes==null?null:r.after.resources.rssBytes/1048576):(r.after.execution?.elapsedTicks??(r.before?Math.max(0,r.after.tick-r.before.tick):null))})).filter(r=>Number.isFinite(r.value));
 const max=Math.max(1,...samples.map(r=>r.value)),first=Math.min(...samples.map(r=>r.after.tick)),last=Math.max(...samples.map(r=>r.after.tick)),span=Math.max(1,last-first),x=r=>first===last?450:70+(r.after.tick-first)/span*760,y=r=>185-r.value/max*150,unit=snapshotMetric==='rss'?'MiB':'Takte';
 const plot=samples.length?`<svg viewBox="0 0 900 235" role="img" aria-label="${samples.length} Snapshot-Messpunkte: ${snapshotMetric==='rss'?'RSS in MiB':'simulierte Ausführungsdauer in Takten'}. Werte stehen in der Datentabelle."><path d="M65 35V185H855M65 110H855M65 35H855" fill="none" stroke="#526773"/>${[0,.5,1].map(f=>`<text x="8" y="${190-f*150}" fill="#b5c4cd" font-size="13">${Math.round(f*max*10)/10}</text>`).join('')}${projects.map(p=>{const series=samples.filter(r=>r.task.project===p.id);return `<polyline points="${series.map(r=>`${x(r)},${y(r)}`).join(' ')}" fill="none" stroke="${p.color}" stroke-width="2"/>`}).join('')}${samples.map(r=>`<circle cx="${x(r)}" cy="${y(r)}" r="5" fill="${project(r.task.project).color}"><title>FT-${r.task.id} / Versuch ${r.after.attempt}: ${r.value} ${unit}, Takt ${r.after.tick}</title></circle>`).join('')}<text x="65" y="220" fill="#b5c4cd" font-size="13">Takt ${first}</text><text x="850" y="220" text-anchor="end" fill="#b5c4cd" font-size="13">Takt ${last}</text></svg><div class="telemetry-legend">${projects.filter(p=>samples.some(r=>r.task.project===p.id)).map(p=>`<span><i style="background:${p.color}"></i>${p.name}</span>`).join('')}</div>`:`<div class="snapshot-empty"><h3>${snapshotMetric==='rss'?'Kein Worker-Speicher gemessen':'Noch keine vollständigen Snapshot-Paare'}</h3><p>${snapshotMetric==='rss'?'Diese Browserdemo kann den Speicher eines Worker-Prozesses nicht messen. Unbekannte Werte bleiben leer.':'Ein neuer Auftrag erfasst beim Start einen Vorher-Snapshot und nach Umsetzung und Checks einen Nachher-Snapshot. Führe dafür die nächsten Takte aus.'}</p></div>`;
 return `<section class="panel technical-section"><h2>Portfolio, Worker-Health & Zeitreihen</h2><p>Die Auswertung verwendet die Snapshots dieser Simulation und folgt dem Projektfilter. Ausgangsaufträge können ohne vollständige Historie starten; fehlende Werte werden nicht ergänzt.</p><div class="board-toolbar"><label for="snapshotMetric">Messgröße</label><select id="snapshotMetric"><option value="duration" ${snapshotMetric==='duration'?'selected':''}>Ausführungsdauer · Simulationstakte</option><option value="rss" ${snapshotMetric==='rss'?'selected':''}>Worker-Speicher · MiB RSS</option></select><span class="pill">${samples.length} Datenpunkte · Browserdemo</span></div>${plot}<p><b>${complete}</b> vollständige Paare · <b>${pending}</b> laufende Versuche mit Vorher-Snapshot · <b>${incomplete}</b> unvollständige historische Paare</p><details class="detail-disclosure"><summary>Snapshot-Datentabelle (${rows.length} beendete Versuche)</summary><div class="table-wrap"><table><caption>Auswertung der archivierten Nachher-Snapshots; unbekannt ist kein Nullwert.</caption><thead><tr><th scope="col">Task / Versuch</th><th scope="col">Worker</th><th scope="col">Takt</th><th scope="col">Dauer</th><th scope="col">Ergebnis</th><th scope="col">Datenabdeckung</th></tr></thead><tbody>${rows.map(r=>`<tr><td><button data-snapshot-task="${r.task.id}">FT-${r.task.id} / ${r.after.attempt}</button></td><td>${esc(r.after.workerId||'Unbekannt')}</td><td>${r.after.tick}</td><td>${r.before?Math.max(0,r.after.tick-r.before.tick)+' Takte':'Unbekannt'}</td><td>${esc(({simulated:'Simuliert erfolgreich',checks_failed:'Checks fehlgeschlagen',interrupted:'Unterbrochen'})[r.after.execution?.outcome]||'Unbekannt')}</td><td>${r.before?'Vorher + Nachher':'Vorher fehlt'}</td></tr>`).join('')||'<tr><td colspan="6">Noch keine beendeten Versuche.</td></tr>'}</tbody></table></div></details><div class="table-wrap"><table><thead><tr><th scope="col">Perspektive</th><th scope="col">Zielmessgrößen</th><th scope="col">Verfügbare Daten</th></tr></thead><tbody><tr><td>Kosten</td><td>Tokens, Cache, gemeldete/geschätzte Kosten; separate Subscription-Zuordnung</td><td>Unbekannt · keine Anbieter-Telemetrie</td></tr><tr><td>Performance</td><td>Warte-, Ausführungs-, Reviewzeit; P50/P95, Durchsatz</td><td>Simulationstakte · keine gemessenen Minuten</td></tr><tr><td>Systemzustand</td><td>CPU/RSS, Heartbeat, Event Loop, Lease-Verlust, Slots</td><td>${workerList().filter(w=>w.online).length}/${workerList().length} Demo-Worker online · ${workerList().reduce((n,w)=>n+freeSlots(w),0)} freie Slots</td></tr><tr><td>Qualität</td><td>Build, Tests, Coverage, Lint, Security, Nacharbeit, CI am aktuellen Head</td><td>Checks simuliert · keine echte Coverage</td></tr><tr><td>Nachvollziehbarkeit</td><td>Worker, Provider, Konfigurationshash, Revision, Commit, Skill-/Policy-Version</td><td>${snapshots.filter(s=>s.phase==='before').length} Vorher- und ${rows.length} Nachher-Snapshots</td></tr></tbody></table></div><p class="notice">Unbekannt ist nicht null Euro. Subscription-Zuordnung ist keine API-Abrechnung. Worker-CPU und RSS bei parallelen Tasks nicht addieren. Takte wirken auf alle Linien; das Diagramm zeigt ausschließlich das ausgewählte Projekt.</p></section>`;
}
function dockerAgentArchitecture(){return `<section class="panel technical-section"><h2>Docker Agent als optionale Laufzeit</h2><p>Docker Agent kann einen Worker-Versuch ausführen oder Factory-Funktionen über MCP bedienen. Es ist kein zusätzlicher Modellanbieter: Subscription-Profile bleiben Claude und Codex.</p><div class="table-wrap"><table><thead><tr><th scope="col">Integration</th><th scope="col">Verantwortung und Grenze</th></tr></thead><tbody><tr><td>Factory-Steuerung über MCP</td><td>Die bereitgestellten Verwaltungstools und eine separate Docker-Agent-Konfiguration verbinden den Agenten mit den freigegebenen Factory-/Orchestrator-Schnittstellen. Servervalidierung und Liniengrenzen bleiben verbindlich.</td></tr><tr><td>Claude-Code- oder Codex-Harness</td><td>Separate Harness-Konfigurationen nutzen die jeweilige native CLI-Anmeldung. Docker-Agent-Toolsets werden in diesem Harness-Modus nicht übernommen; die erlaubten Tools und Skills müssen über den jeweiligen Coding-Runner kontrolliert werden.</td></tr><tr><td>Agententeam im Worker-Versuch</td><td>Ein Team arbeitet innerhalb eines reservierten Versuchs und seines Arbeitsverzeichnisses. Taskboard, Leases, Snapshot-Nachweise und der menschliche Review-/Merge-Abschluss bleiben unter Kontrolle des Orchestrators.</td></tr></tbody></table></div><p class="notice">Integrationsstand: Verwaltung über MCP und Beispielkonfigurationen sind ein eigener Einstieg. Die automatische Coding-Ausführung eines Worker-Versuchs über Docker Agent ist noch nicht live verbunden. Diese Browserdemo startet weder Docker Agent noch Provider-CLIs.</p><a href="https://docker.github.io/docker-agent/features/harnesses/" target="_blank" rel="noopener noreferrer">Docker Agent: Coding-Harnesses und native CLI-Anmeldung</a></section>`}
function systemView(){return `<section class="technical-intro"><h2>Das Projekt-Repo ist die gemeinsame Arbeitsgrundlage.</h2><p>Produktteam und Fabrik arbeiten zeitlich überlappend: Das Team spezifiziert die nächste Iteration, während die Fabrik die freigegebenen Features der aktuellen Iteration umsetzt.</p></section><section class="panel technical-section"><h2>Branches und Pull Requests</h2><div class="table-wrap"><table><tr><th>Objekt</th><th>Quelle → Ziel</th><th>Verantwortung</th></tr><tr><td>Iterations-Draft-PR</td><td>iteration/2026-W42 → main</td><td>Produktteam: Planung, Specs, Designs, Tests und Integration</td></tr><tr><td>Feature-Draft-PR</td><td>factory/REQ-241 → iteration/2026-W42</td><td>Worker: beim Start öffnen; Code und Snapshot-Paare liefern</td></tr><tr><td>Review-Nacharbeit</td><td>Derselbe Feature-Branch und PR</td><td>Neuer Versuch mit neuen Snapshots; bevorzugt derselbe Worker, Projektbindung bleibt verbindlich</td></tr><tr><td>Feature-Merge</td><td>Feature-PR ist in den Iterationsbranch gemerged</td><td>Orchestrator markiert Task erledigt; Iterationsabschluss separat</td></tr></table></div><p>Ein erster Commit mit Vorher-Snapshot stellt bereits beim Arbeitsstart einen PR-Diff bereit. Der serverseitige Git-Publisher führt den Push im Auftrag des Workers aus und prüft die Lease. Nach Umsetzung und Checks kommen Code plus Nachher-Snapshot in denselben PR; anschließend wird menschliches Review angefordert.</p><p>Freigaben und Checks gehören zum aktuellen PR-Head. Neue Änderungen machen alte Freigaben für den Abschluss ungültig. Kein automatischer Merge durch den Agenten. Abhängige Features werden erst nach Merge ihrer Voraussetzungen gestartet; Konflikte im Iterationsbranch führen in eine eigene Nacharbeitsschleife.</p></section><section class="panel technical-section"><h2>Obsidian, Intake und versionierte Snapshots</h2><p>Der vollständige committed Vault bleibt verfügbar: Markdown, Properties, Links, Backlinks, Überschriften, Block-IDs, Einbettungen, Tags, Canvas und Anhänge. Der Importer interpretiert ausschließlich die vereinbarten Factory-Properties. Die übrigen Obsidian-Inhalte sind Kontext und werden über dafür geeignete Reader erschlossen; der Starter rendert nicht sämtliche Obsidian-Core-Funktionen.</p><p>Idempotenzschlüssel: Projekt + Iteration + Feature-ID. Ready-Features werden am Git-Commit gepinnt. Änderungen an bereits importierten Specs erfordern eine explizite Revision; ein erneuter Scan erzeugt keine Duplikate. Die nächste Iteration nutzt einen getrennten Planungsbranch; Übernahme von Änderungen und Rebase werden bewusst gesteuert.</p><pre class="code">.factory/runs/FEATURE-ID/attempt-N/LEASE-ID/before.json
.factory/runs/FEATURE-ID/attempt-N/LEASE-ID/after.json</pre><p>Snapshots sind unveränderlich, schema-versioniert und mit SHA-256 im Orchestrator indexiert. Ein Outbox-Journal überträgt sie erneut bei Netzverlust. Späte Telemetrie wird ihrem alten Versuch zugeordnet; sie darf keinen Task abschließen. Bei einem harten Absturz entsteht nach Wiederanlauf ein als rekonstruiert markierter Abbruch-Snapshot. Fehlt dieser dauerhaft, bleibt die Datenlücke sichtbar.</p><p>Der Nachher-Snapshot enthält den geprüften Code-Stand. Der finale Telemetrie-Commit kann nicht seinen eigenen Hash enthalten. PR, finaler Head, spätere CI und Review-Ergebnisse werden deshalb als separate Ereignisse ergänzt. Langfristige Zeitreihen liegen in SQLite, die prüfbaren Originaldateien im Feature-PR.</p></section>`+dockerAgentArchitecture()+systemArchitectureView()}

render();

</script></body></html>

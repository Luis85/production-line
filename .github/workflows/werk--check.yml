# Generated by forge workflows sync from projects/werk/src/infrastructure/workflows/check/check.yml.
# Do not edit this file; change the source and run: node bin/forge.js workflows sync

name: Werk checks
on:
  push:
    branches: [ main ]
    paths:
      - "**"
      - .github/workflows/werk--check.yml
  pull_request:
    paths:
      - "**"
      - .github/workflows/werk--check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: werk-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FORGE_PROJECT_PATH: projects/werk
defaults:
  run:
    working-directory: projects/werk
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    # Native Windows containment and multi-clone Git journeys need extra time.
    # Keep per-test/command deadlines; allow the full suite to report failures.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 40 || 15 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.FORGE_PROJECT_PATH }}/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - name: Run full check (POSIX)
        if: matrix.os != 'windows-latest'
        timeout-minutes: 11
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/werk-check.log"
      - name: Run full check (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 36
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          npm run check 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/werk-check.log"
          exit $LASTEXITCODE
      # Step deadlines leave time for best-effort diagnostics. Runner loss or
      # cancellation grace exhausting the job budget can still prevent upload.
      - name: Retain full check output
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: werk-check-output-${{ matrix.os }}
          path: ${{ runner.temp }}/werk-check.log
          if-no-files-found: warn
          retention-days: 7
      - run: npm run audit:dependencies
      - name: Check generated workflow drift
        working-directory: .
        run: node bin/forge.js workflows sync --check
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [ factory, orchestrator, worker ]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build independent service image
        run: docker build --file src/${{ matrix.service }}/Dockerfile --tag werk-${{ matrix.service }}:check .
  storybook:
    name: Storybook and screenshot qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.FORGE_PROJECT_PATH }}/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install the locked browser version and system libraries
        run: npm exec -- playwright install --with-deps chromium
      - name: Build the code-derived stories and qualify every component screenshot
        run: npm run storybook:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: werk-storybook-check-evidence
          path: ${{ env.FORGE_PROJECT_PATH }}/storybook-static/storymap/
          if-no-files-found: warn
          retention-days: 7
